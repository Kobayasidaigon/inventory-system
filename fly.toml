# fly.toml app configuration file generated for inventory-system
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "inventory-system-aburiva"
primary_region = "nrt" # Tokyo region

[build]

[env]
  # コンテナの既定は UTC。日付は日本時間で扱うので合わせておく。
  # 在庫履歴の日付や在庫推移グラフの目盛りが 1 日ずれるのを防ぐ。
  TZ = "Asia/Tokyo"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # 0 にするとアクセスが途切れたときマシンが止まり、定期処理
  # （バックアップ・シフト未確認の通知）が動かない。
  # 通知が不要なら 0 に戻してよい。
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "inventory_data"
  destination = "/data"
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 3000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "1s"
