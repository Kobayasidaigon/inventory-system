name: ジョブカン シフト取得

# 毎月 14 日と 30 日の 15:00 UTC（日本時間 翌 0:00）に実行する。
#   14 日 → 当月ぶん
#   30 日 → 翌月ぶん（月末に来月のシフトを先取りする）
# 対象月の判定はスクリプト側（25 日以降なら翌月）が行う。
on:
  schedule:
    - cron: '0 15 14,30 * *'
  workflow_dispatch:
    inputs:
      target_month:
        description: '対象月 (YYYY-MM)。空なら自動で決める'
        required: false
        type: string
      dry_run:
        description: '取得だけして保存しない'
        required: false
        type: boolean
        default: false

# 取り込みが重ならないようにする
concurrency:
  group: jobcan-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: 取得して取り込む
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # ここではブラウザを使うので、postinstall の自動取得は止めて
      # 次のステップで明示的に入れる（入る場所を固定したいため）
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Chrome を導入
        run: npx puppeteer browsers install chrome

      - name: 取得して取り込む
        # 手動実行の入力値はシェルに直接埋め込まず、環境変数として渡す。
        # ${{ }} で本文に埋め込むと、入力した文字列がそのままコマンドとして
        # 動いてしまう。
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$TARGET_MONTH" ]; then args+=("$TARGET_MONTH"); fi
          node scripts/scrape-jobcan.js "${args[@]}"
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_MONTH: ${{ inputs.target_month }}
          JOBCAN_EMAIL: ${{ secrets.JOBCAN_EMAIL }}
          JOBCAN_PASSWORD: ${{ secrets.JOBCAN_PASSWORD }}
          API_BASE: ${{ secrets.API_BASE }}
          IMPORT_SECRET: ${{ secrets.IMPORT_SECRET }}
          JOBCAN_GROUPS: ${{ vars.JOBCAN_GROUPS }}

      # 失敗したときに原因を追えるよう、伏せ字にした HTML を残す。
      # ジョブカンの画面構成が変わったときは、ここを見てセレクタを直す。
      #
      # path は debug/ 全体ではなく *.html に限る。このリポジトリは公開されていて
      # アーティファクトは誰でもダウンロードできるので、伏せ字にできないもの
      # （取得結果の JSON など）を巻き込まないようにする。
      - name: 調査用のファイルを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobcan-debug-${{ github.run_number }}
          path: debug/*.html
          retention-days: 7
          if-no-files-found: ignore
